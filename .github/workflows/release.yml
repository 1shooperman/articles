name: Release

on:
  workflow_run:
    workflows: ['Tag Release']
    types: [completed]
    branches: [main]

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
    steps:
      - name: Checkout main (version-bump commit from Tag Release)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (root + MCP server)
        run: npm run build:mcp

      - name: Get release tag and version
        id: meta
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create zip artifact
        run: |
          zip -r articles-${{ steps.meta.outputs.tag }}.zip . \
            -x "node_modules/*" \
            -x "mcp-server/node_modules/*" \
            -x ".git/*" \
            -x "*.git*" \
            -x "coverage/*" \
            -x "__tests__/*" \
            -x "*.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body: |
            CLI + MCP server (stdio and Streamable HTTP). See [README](https://github.com/${{ github.repository }}/blob/main/README.md).
            After extracting the zip, run `npm ci` then `node mcp-server/dist/stdio.js` (or use the MCP server path in Cursor).
          files: articles-${{ steps.meta.outputs.tag }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
